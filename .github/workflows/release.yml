name: Tagged signed release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        default: '2026.09.12'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]] || {
            echo "Expected version YYYY.MM.DD, got: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  python-tests:
    uses: ./.github/workflows/python-tests.yml

  application:
    needs:
      - prepare
      - python-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source tree
        uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Generate API resources and check browser scripts
        run: npm ci && npm run build && npm test

      - name: Checkout apk-tools
        uses: actions/checkout@v6
        with:
          repository: alpinelinux/apk-tools
          path: apk-tools
          fetch-depth: 0
          ref: b5a31c0d865342ad80be10d68f1bb3d3ad9b0866

      - name: Checkout po2lmo
        uses: actions/checkout@v6
        with:
          repository: openwrt/luci
          path: po2lmo
          sparse-checkout: modules/luci-base/src

      - name: Set up package tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E rm -rf /var/lib/man-db/auto-update
          sudo -E apt-get update -qq
          sudo -E apt-get install -y build-essential curl fakeroot libssl-dev lua5.1 meson ninja-build

          pushd apk-tools
          meson setup build \
            -Db_lto=true \
            -Dcompressed-help=false \
            -Ddocs=disabled \
            -Dhelp=enabled \
            -Dlua_version=5.1 \
            -Ddefault_library=static \
            -Durl_backend=wget \
            -Dzstd=false \
            -Dpython=disabled \
            -Dtests=disabled \
            -Dcrypto_backend=openssl
          ninja -C build
          sudo -E meson install -C build --strip
          popd

          pushd po2lmo/modules/luci-base/src
          make po2lmo
          sudo -E install -m0755 -s po2lmo /usr/local/bin/po2lmo
          popd

          curl -fsSLo ipkg-build https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build
          sudo install -m0755 ipkg-build /usr/local/bin/ipkg-build

      - name: Load and validate APK signing key
        env:
          SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo 'APK_SIGNING_KEY is not configured' >&2; exit 1; }
          printf '%s\n' "$SIGNING_KEY" > /tmp/homeproxy-apk-signing.pem
          chmod 0600 /tmp/homeproxy-apk-signing.pem
          openssl pkey -in /tmp/homeproxy-apk-signing.pem -pubout -out /tmp/homeproxy-apk-public.pem
          cmp /tmp/homeproxy-apk-public.pem release/homeproxy-apk.pem

      - name: Build signed application packages
        env:
          PKG_VERSION: ${{ needs.prepare.outputs.version }}
          APK_SIGNING_KEY_FILE: /tmp/homeproxy-apk-signing.pem
        run: |
          pushd .github
          fakeroot bash build-ipk.sh apk release
          fakeroot bash build-ipk.sh ipk release
          popd
          apk --keys-dir "$GITHUB_WORKSPACE/release" verify .github/*.apk

      - name: Stage application packages and host APK tool
        run: |
          mkdir -p /tmp/homeproxy-release-application
          cp .github/*.apk .github/*.ipk /tmp/homeproxy-release-application/
          cp /usr/local/bin/apk /tmp/homeproxy-release-application/apk-host

      - uses: actions/upload-artifact@v7
        with:
          name: release-application
          path: /tmp/homeproxy-release-application/
          if-no-files-found: error

  paired-core:
    needs:
      - prepare
      - python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: SDK prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev python3 rsync unzip zstd file wget

      - name: Download pinned SDK
        run: |
          sdk_url="$(python3 scripts/pairing.py sdk_url)"
          sdk_hash="$(python3 scripts/pairing.py sdk_sha256)"
          curl --fail --location --retry 3 "$sdk_url" -o /tmp/homeproxy-sdk.tar.zst
          echo "$sdk_hash  /tmp/homeproxy-sdk.tar.zst" | sha256sum -c -
          mkdir /tmp/homeproxy-sdk
          tar --zstd -xf /tmp/homeproxy-sdk.tar.zst -C /tmp/homeproxy-sdk --strip-components=1

      - name: Load and validate APK signing key
        env:
          SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo 'APK_SIGNING_KEY is not configured' >&2; exit 1; }
          printf '%s\n' "$SIGNING_KEY" > /tmp/homeproxy-apk-signing.pem
          chmod 0600 /tmp/homeproxy-apk-signing.pem
          openssl pkey -in /tmp/homeproxy-apk-signing.pem -pubout -out /tmp/homeproxy-apk-public.pem
          cmp /tmp/homeproxy-apk-public.pem release/homeproxy-apk.pem

      - name: Build and sign paired sing-box
        run: |
          scripts/build-sdk.sh /tmp/homeproxy-sdk
          mapfile -t core_packages < <(find /tmp/homeproxy-sdk/bin/packages -type f -name 'sing-box-*.apk')
          [ "${#core_packages[@]}" -eq 1 ] || {
            printf 'Expected one sing-box package, found %d\n' "${#core_packages[@]}" >&2
            exit 1
          }
          host_apk=/tmp/homeproxy-sdk/staging_dir/host/bin/apk
          "$host_apk" adbsign --allow-untrusted --reset-signatures --sign-key /tmp/homeproxy-apk-signing.pem "${core_packages[0]}"
          "$host_apk" --keys-dir "$GITHUB_WORKSPACE/release" verify "${core_packages[0]}"
          mkdir -p /tmp/homeproxy-release-core
          cp "${core_packages[0]}" /tmp/homeproxy-release-core/

      - uses: actions/upload-artifact@v7
        with:
          name: release-core
          path: /tmp/homeproxy-release-core/
          if-no-files-found: error

  bundle:
    needs:
      - prepare
      - application
      - paired-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: /tmp/homeproxy-release
          merge-multiple: true

      - name: Build and verify signed repository
        env:
          SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo 'APK_SIGNING_KEY is not configured' >&2; exit 1; }
          printf '%s\n' "$SIGNING_KEY" > /tmp/homeproxy-apk-signing.pem
          chmod 0600 /tmp/homeproxy-apk-signing.pem

          install -m0755 /tmp/homeproxy-release/apk-host /tmp/apk
          rm /tmp/homeproxy-release/apk-host
          cp release/homeproxy-apk.pem /tmp/homeproxy-release/homeproxy-apk.pem

          /tmp/apk mkndx \
            --keys-dir "$GITHUB_WORKSPACE/release" \
            --sign-key /tmp/homeproxy-apk-signing.pem \
            --output /tmp/homeproxy-release/packages.adb \
            /tmp/homeproxy-release/*.apk
          /tmp/apk --keys-dir "$GITHUB_WORKSPACE/release" verify \
            /tmp/homeproxy-release/*.apk \
            /tmp/homeproxy-release/packages.adb

          printf '%s\n' \
            "HomeProxy $VERSION" \
            "" \
            "Signed APK feed:" \
            "https://github.com/wilksu/homeproxy/releases/latest/download/packages.adb" \
            "" \
            "See docs/releases.md in the source repository for first-install instructions." \
            > /tmp/homeproxy-release/INSTALL.txt

          pushd /tmp/homeproxy-release
          sha256sum *.apk *.ipk homeproxy-apk.pem packages.adb INSTALL.txt > SHA256SUMS
          popd

      - uses: actions/upload-artifact@v7
        with:
          name: homeproxy-${{ needs.prepare.outputs.version }}
          path: /tmp/homeproxy-release/
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            /tmp/homeproxy-release/* \
            --verify-tag \
            --latest \
            --title "HomeProxy ${{ needs.prepare.outputs.version }}" \
            --generate-notes
