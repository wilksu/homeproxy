name: Build and release paired sing-box core

on:
  push:
    branches:
      - master
    paths:
      - root/usr/share/homeproxy/compat.json
  workflow_dispatch:
    inputs:
      aarch64_cortex_a53:
        description: ARM64 Cortex-A53 / Filogic
        type: boolean
        default: true
      x86_64:
        description: x86-64
        type: boolean
        default: true
      aarch64_generic:
        description: Generic ARM64
        type: boolean
        default: false
      aarch64_cortex_a72:
        description: ARM64 Cortex-A72
        type: boolean
        default: false
      publish_release:
        description: Publish or extend the core GitHub Release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: paired-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      matrix: ${{ steps.plan.outputs.matrix }}
      source_version: ${{ steps.plan.outputs.source_version }}
      package_version: ${{ steps.plan.outputs.package_version }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - id: plan
        name: Resolve version change and selected architectures
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          SELECT_A53: ${{ inputs.aarch64_cortex_a53 }}
          SELECT_X86: ${{ inputs.x86_64 }}
          SELECT_GENERIC: ${{ inputs.aarch64_generic }}
          SELECT_A72: ${{ inputs.aarch64_cortex_a72 }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          manifest=root/usr/share/homeproxy/compat.json
          package_version=$(jq -er '.core_package_version' "$manifest")
          source_version=$(jq -er '.core_version' "$manifest")
          [[ "$package_version" =~ ^${source_version}-r[0-9]+$ ]] || {
            echo "Invalid paired package version: $package_version" >&2
            exit 1
          }

          build=true
          publish="$PUBLISH_RELEASE"
          selected=()
          if [[ "$EVENT_NAME" == push ]]; then
            publish=true
            selected=(aarch64_cortex-a53 x86_64)
            if [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
              old_version=$(git show "$BEFORE_SHA:$manifest" 2>/dev/null | jq -r '.core_package_version // empty' || true)
              if [[ "$old_version" == "$package_version" ]]; then
                build=false
                echo "Core package version is unchanged ($package_version); no release required."
              fi
            fi
          else
            [[ "$SELECT_A53" == true ]] && selected+=(aarch64_cortex-a53)
            [[ "$SELECT_X86" == true ]] && selected+=(x86_64)
            [[ "$SELECT_GENERIC" == true ]] && selected+=(aarch64_generic)
            [[ "$SELECT_A72" == true ]] && selected+=(aarch64_cortex-a72)
          fi
          [[ "$publish" == true || "$publish" == false ]] || publish=false

          if [[ "$build" == true && ${#selected[@]} -eq 0 ]]; then
            echo 'Select at least one architecture.' >&2
            exit 1
          fi

          rows=()
          for target in "${selected[@]}"; do
            row=$(jq -cer --arg target "$target" '
              .core_targets[$target] + {target: $target}
              | select(.goarch)
            ' "$manifest")
            rows+=("$row")
          done
          matrix=$(printf '%s\n' "${rows[@]}" | jq -cs '{include: .}')
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "source_version=$source_version" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=core-v$package_version" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Download and verify pinned sing-box source
        env:
          SOURCE_VERSION: ${{ needs.prepare.outputs.source_version }}
        run: |
          source_hash=$(python3 scripts/pairing.py core_source_sha256)
          curl --fail --location --retry 3 \
            "https://codeload.github.com/SagerNet/sing-box/tar.gz/v$SOURCE_VERSION" \
            -o /tmp/sing-box.tar.gz
          echo "$source_hash  /tmp/sing-box.tar.gz" | sha256sum -c -
          mkdir sing-box
          tar -xzf /tmp/sing-box.tar.gz -C sing-box --strip-components=1

      - uses: actions/setup-go@v7
        with:
          go-version-file: sing-box/go.mod
          cache-dependency-path: sing-box/go.sum

      - name: Build static sing-box binary
        env:
          SOURCE_VERSION: ${{ needs.prepare.outputs.source_version }}
          GOARCH: ${{ matrix.goarch }}
          TUNING: ${{ matrix.tuning }}
        working-directory: sing-box
        run: |
          set -euo pipefail
          export GOOS=linux CGO_ENABLED=0 GOTOOLCHAIN=local
          case "$TUNING" in
            GOARM64=*) export GOARM64="${TUNING#*=}" ;;
            GOAMD64=*) export GOAMD64="${TUNING#*=}" ;;
            *) echo "Unsupported target tuning: $TUNING" >&2; exit 1 ;;
          esac
          tags=$(jq -r '.core_build_tags | join(",")' ../root/usr/share/homeproxy/compat.json)
          shared_ldflags=$(cat release/LDFLAGS)
          mkdir -p /tmp/core-root/usr/bin
          go build -trimpath \
            -tags "$tags" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=$SOURCE_VERSION $shared_ldflags -s -w -buildid=" \
            -o /tmp/core-root/usr/bin/sing-box ./cmd/sing-box
          go version -m /tmp/core-root/usr/bin/sing-box > /tmp/core-build-info.txt

      - uses: actions/checkout@v6
        with:
          repository: alpinelinux/apk-tools
          path: apk-tools
          fetch-depth: 1
          ref: b5a31c0d865342ad80be10d68f1bb3d3ad9b0866

      - name: Build pinned host APK tool
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y build-essential libssl-dev meson ninja-build
          meson setup apk-tools/build apk-tools \
            -Db_lto=true -Dcompressed-help=false -Ddocs=disabled -Dhelp=enabled \
            -Ddefault_library=static -Durl_backend=wget -Dzstd=false \
            -Dpython=disabled -Dtests=disabled -Dcrypto_backend=openssl
          ninja -C apk-tools/build
          sudo -E meson install -C apk-tools/build --strip

      - name: Package, sign and validate core
        env:
          SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
          SOURCE_VERSION: ${{ needs.prepare.outputs.source_version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          [ -n "$SIGNING_KEY" ] || { echo 'APK_SIGNING_KEY is not configured' >&2; exit 1; }
          printf '%s\n' "$SIGNING_KEY" > /tmp/homeproxy-apk-signing.pem
          chmod 0600 /tmp/homeproxy-apk-signing.pem
          openssl pkey -in /tmp/homeproxy-apk-signing.pem -pubout -out /tmp/homeproxy-apk-public.pem
          cmp /tmp/homeproxy-apk-public.pem release/homeproxy-apk.pem

          output=/tmp/core-release
          mkdir "$output"
          APK_SIGNING_KEY_FILE=/tmp/homeproxy-apk-signing.pem \
            scripts/build-core-package.sh /tmp/core-root "$TARGET" "$PACKAGE_VERSION" "$output"
          package="$output/sing-box-${PACKAGE_VERSION}-${TARGET}.apk"
          apk --keys-dir "$GITHUB_WORKSPACE/release" verify "$package"

          metadata=$(apk adbdump "$package")
          grep -q "  name: sing-box$" <<<"$metadata"
          grep -q "  version: ${PACKAGE_VERSION}$" <<<"$metadata"
          grep -q "  arch: ${TARGET}$" <<<"$metadata"
          expected_tags=$(jq -r '.core_build_tags | join(",")' root/usr/share/homeproxy/compat.json)
          grep -q "build[[:space:]]*-tags=${expected_tags}" /tmp/core-build-info.txt

          if [[ "$TARGET" == x86_64 ]]; then
            /tmp/core-root/usr/bin/sing-box version | grep -Fx "sing-box version $SOURCE_VERSION"
            printf '{"inbounds":[],"outbounds":[]}' > /tmp/minimal.json
            /tmp/core-root/usr/bin/sing-box check -c /tmp/minimal.json
          fi
          grep -aq '/daemon.StartedService/GetVersion' /tmp/core-root/usr/bin/sing-box
          grep -aq '/daemon.StartedService/SubscribeConnections' /tmp/core-root/usr/bin/sing-box

          sha256sum "$package" > "$package.sha256"
          jq -n \
            --arg target "$TARGET" \
            --arg package_version "$PACKAGE_VERSION" \
            --arg source_version "$SOURCE_VERSION" \
            --arg tags "$expected_tags" \
            --arg source_sha256 "$(python3 scripts/pairing.py core_source_sha256)" \
            --arg package_sha256 "$(sha256sum "$package" | cut -d' ' -f1)" \
            --argjson core_binary_bytes "$(wc -c < /tmp/core-root/usr/bin/sing-box)" \
            '{target:$target,package_version:$package_version,source_version:$source_version,build_tags:($tags|split(",")),source_sha256:$source_sha256,package_sha256:$package_sha256,core_binary_bytes:$core_binary_bytes,cgo_enabled:false}' \
            > "$output/sing-box-${PACKAGE_VERSION}-${TARGET}.json"

      - uses: actions/upload-artifact@v7
        with:
          name: paired-core-${{ matrix.target }}
          path: /tmp/core-release/
          if-no-files-found: error

  release:
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.build == 'true' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          pattern: paired-core-*
          path: /tmp/core-release
          merge-multiple: true

      - name: Create or extend core release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --latest=false \
              --title "HomeProxy paired sing-box $PACKAGE_VERSION" \
              --notes "Architecture-specific sing-box packages built directly from the pinned upstream source with CGO disabled and signed with the HomeProxy APK key."
          fi

          existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          while IFS= read -r asset; do
            name=$(basename "$asset")
            if grep -Fxq "$name" <<<"$existing"; then
              echo "Release asset already exists; refusing to overwrite: $name" >&2
              exit 1
            fi
          done < <(find /tmp/core-release -type f -print)
          gh release upload "$RELEASE_TAG" /tmp/core-release/*
